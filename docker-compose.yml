services:
  # The web server running PHP 8.2 with Apache
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "80:80"
    volumes:
      # Mounts the current directory to /var/www/html/Inventory
      # So that the frontend can access http://localhost/Inventory/public/api exactly like Laragon
      - .:/var/www/html/Inventory
    environment:
      # These variables will be picked up by database.php
      - DB_HOST=db
      - DB_DATABASE=inventory_db
      - DB_USERNAME=root
      - DB_PASSWORD=secret
    depends_on:
      - db

  # The MySQL Database
  db:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=secret
      - MYSQL_DATABASE=inventory_db
    volumes:
      # Persistent storage for MySQL data
      - db_data:/var/lib/mysql
      # Auto-run SQL scripts on container start if database is empty
      - ./docker/mysql/init/1-schema.sql:/docker-entrypoint-initdb.d/1-schema.sql
      - ./docker/mysql/init/2-seed.sql:/docker-entrypoint-initdb.d/2-seed.sql

  # phpMyAdmin for managing the database visually
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    ports:
      - "8080:80"
    environment:
      - PMA_HOST=db
      - PMA_USER=root
      - PMA_PASSWORD=secret
    depends_on:
      - db

volumes:
  # Docker managed volume to persist your local database data across container restarts
  db_data:
